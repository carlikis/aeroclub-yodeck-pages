<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, height=1080">
<title>Cultura Aeronáutica · Seguridad</title>

<style>
:root {
  --bg: #1e1e2d;
  --accent: #ffb400;
  --text: #ffffff;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, Helvetica, sans-serif;
  overflow: hidden;
}

header {
  text-align: center;
  padding: 3vh;
  font-size: 4vw;
  font-weight: bold;
  letter-spacing: 0.15em;
}

#content {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 70vh;
  text-align: center;
  padding: 0 8vw;
}

.icon {
  font-size: 10vw;
  margin-bottom: 3vh;
  color: var(--accent);
}

h1 {
  font-size: 4vw;
  margin: 0 0 2vh;
}

h2 {
  font-size: 2.2vw;
  font-weight: normal;
  opacity: 0.9;
}

footer {
  text-align: center;
  font-size: 1.6vw;
  opacity: 0.6;
}
</style>
</head>

<body>

<header>CULTURA DE SEGURIDAD</header>

<div id="content">
  <div>
    <div class="icon" id="icon">⚠️</div>
    <h1 id="main">Cargando…</h1>
    <h2 id="sub"></h2>
  </div>
</div>

<footer>Real Aeroclub de Alicante</footer>

<script>
const SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQIJAiX1NwS4PrlDh_jARrzHgPeR2IH7JJuCa6fWjTZGVnHOB9fPqT_HDss_5zmtGD3205STqTVJYWB/pub?gid=0&single=true&output=csv";

let data = [];
let index = 0;

fetch(SHEET_URL)
  .then(r => r.text())
  .then(text => {
    const rows = text.trim().split("\n").slice(1);
    data = rows.map(r => {
      const [activo, main, sub, icon] = r.split(",");
      return { activo, main, sub, icon };
    }).filter(r => r.activo === "1");
    show();
    setInterval(show, 5000);
  });

function show() {
  const item = data[index];
  document.getElementById("main").textContent = item.main;
  document.getElementById("sub").textContent = item.sub;
  document.getElementById("icon").textContent = iconMap(item.icon);
  index = (index + 1) % data.length;
}

function iconMap(name) {
  const icons = {
    warning: `<svg viewBox="0 0 512 512" width="5vw" height="5vw"><path fill="orange" d="M256 0C114.62 0 0 114.62 0 256s114.62 256 256 256 256-114.62 256-256S397.38 0 256 0zm0 400c-13.25 0-24-10.75-24-24s10.75-24 24-24 24 10.75 24 24-10.75 24-24 24zm24-96h-48V112h48v192z"/></svg>`,
    checklist: `<svg viewBox="0 0 512 512" width="5vw" height="5vw"><path fill="#00bfff" d="M173.898 439.404l-166.4-166.4c-9.997-9.997-9.997-26.206 0-36.204l36.203-36.203c9.997-9.998 26.207-9.998 36.204 0L192 312.69l276.095-276.095c9.997-9.997 26.207-9.997 36.204 0l36.203 36.203c9.997 9.997 9.997 26.207 0 36.204L209.102 439.404c-9.997 9.997-26.207 9.997-36.204 0z"/></svg>`,
    decision: `<svg viewBox="0 0 512 512" width="5vw" height="5vw"><path fill="#28a745" d="M256 0C114.836 0 0 114.836 0 256s114.836 256 256 256 256-114.836 256-256S397.164 0 256 0zm0 472c-119.297 0-216-96.703-216-216S136.703 40 256 40s216 96.703 216 216-96.703 216-216 216z"/></svg>`,
    tie: `<svg viewBox="0 0 448 512" width="5vw" height="5vw"><path fill="#ffb400" d="M207.029 0h33.942c9.733 0 18.722 5.823 22.59 14.497l83.867 184.166c4.33 9.496 1.963 20.439-5.899 27.801L256 313.5l-85.529-87.036c-7.862-7.362-10.229-18.305-5.899-27.801L184.439 14.497C188.307 5.823 197.296 0 207.029 0z"/></svg>`,
    headset: `<svg viewBox="0 0 512 512" width="5vw" height="5vw"><path fill="#ff6f61" d="M256 0C114.624 0 0 114.624 0 256v128c0 35.346 28.654 64 64 64h32c17.673 0 32-14.327 32-32V320c0-17.673-14.327-32-32-32H64v-32c0-105.869 86.131-192 192-192s192 86.131 192 192v32h-32c-17.673 0-32 14.327-32 32v96c0 17.673 14.327 32 32 32h32c35.346 0 64-28.654 64-64V256C512 114.624 397.376 0 256 0z"/></svg>`
  };
  return icons[name] || `<svg viewBox="0 0 512 512" width="5vw" height="5vw"><path fill="#ffffff" d="M256 0l96 192h160l-128 128 64 192-192-96-192 96 64-192L64 192h160z"/></svg>`;
}

</script>

</body>
</html>
