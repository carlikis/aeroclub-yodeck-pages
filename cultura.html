<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, height=1080">
<title>Cultura Aeronáutica · Visitantes</title>

<style>
:root {
  --bg: #0f2a44;
  --accent: #00bfff;
  --text: #ffffff;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, Helvetica, sans-serif;
  overflow: hidden;
}

header {
  text-align: center;
  padding: 3vh;
  font-size: 4vw;
  font-weight: bold;
  letter-spacing: 0.15em;
}

#content {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 70vh;
  text-align: center;
  padding: 0 8vw;
}

.icon {
  font-size: 10vw;
  margin-bottom: 3vh;
  color: var(--accent);
}

h1 {
  font-size: 4vw;
  margin: 0 0 2vh;
}

h2 {
  font-size: 2.2vw;
  font-weight: normal;
  opacity: 0.9;
}

footer {
  text-align: center;
  font-size: 1.6vw;
  opacity: 0.6;
}
</style>
</head>

<body>

<header>DESCUBRE LA AVIACIÓN</header>

<div id="content">
  <div>
    <div class="icon" id="icon">✈️</div>
    <h1 id="main">Cargando…</h1>
    <h2 id="sub"></h2>
  </div>
</div>

<footer>Escuela de Vuelo · Real Aeroclub de Alicante</footer>

<script>
const SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQIJAiX1NwS4PrlDh_jARrzHgPeR2IH7JJuCa6fWjTZGVnHOB9fPqT_HDss_5zmtGD3205STqTVJYWB/pub?gid=0&single=true&output=csv";

let data = [];
let index = 0;

fetch(SHEET_URL)
  .then(r => r.text())
  .then(text => {
    const rows = text.trim().split("\n").slice(1);
    data = rows.map(r => {
      const [activo, main, sub, icon] = r.split(",");
      return { activo, main, sub, icon };
    }).filter(r => r.activo === "1");
    show();
    setInterval(show, 12000);
  });

function show() {
  const item = data[index];
  document.getElementById("main").textContent = item.main;
  document.getElementById("sub").textContent = item.sub;
  document.getElementById("icon").textContent = iconMap(item.icon);
  index = (index + 1) % data.length;
}

function iconMap(name) {
  return {
    plane: "✈️",
    school: "🏫",
    glide: "🪂",
    heart: "❤️",
    ground: "🛫"
  }[name] || "✈️";
}
</script>

</body>
</html>
