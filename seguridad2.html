<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, height=1080, initial-scale=1.0">
<title>Seguridad Operacional - Real Aeroclub de Alicante</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&display=swap" rel="stylesheet">

<style>
:root{
    --blue:#003a8f;
    --red:#c62828;
    --bg:#0e1624;
    --white:#ffffff;
    --muted:#b0c4de;
}

*{box-sizing:border-box;}

body{
    margin:0;
    width:100vw;
    height:100vh;
    font-family:'Roboto',sans-serif;
    background:var(--bg);
    color:var(--white);
    overflow:hidden;
    display:flex;
    flex-direction:column;
}

/* CABECERA */
header{
    background:var(--blue);
    padding:2vh;
    text-align:center;
}
header h1{
    margin:0;
    font-size:3.5vw;
    letter-spacing:0.15em;
    font-weight:900;
}
header p{
    margin:0;
    font-size:1.5vw;
    color:var(--muted);
}

/* CONTENIDO */
main{
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    padding:3vw;
    text-align:center;
}

/* ICONO */
.icon{
    width:8vw;
    height:8vw;
    margin-bottom:2vw;
    color:var(--red);
}
.icon svg{
    width:100%;
    height:100%;
    fill:currentColor;
}

/* TEXTO */
main h2{
    font-size:3vw;
    margin:0 0 1.5vw 0;
    color:var(--red);
}
main ul{
    list-style:none;
    padding:0;
    margin:0;
    font-size:2vw;
    line-height:1.6;
}
main ul li::before{
    content:"▸ ";
    color:var(--red);
    font-weight:900;
}

/* FOOTER */
footer{
    background:#000;
    padding:1.5vh;
    text-align:center;
    font-size:1.3vw;
    color:var(--muted);
}
</style>
</head>

<body>

<header>
    <h1>REAL AEROCLUB DE ALICANTE</h1>
    <p>Cultura Aeronáutica · Seguridad Operacional</p>
</header>

<main>

    <!-- ICONO SEGURIDAD -->
    <div class="icon">
        <svg viewBox="0 0 640 512" aria-hidden="true">
            <path d="M320 0l96 192h160l-128 128 64 192-192-96-192 96 64-192L64 192h160z"/>
        </svg>
    </div>

    <h2 id="titulo">Cargando...</h2>

    <ul id="lista"></ul>

</main>

<footer>
    Operaciones seguras · Profesionalidad · Espíritu aeronáutico
</footer>

<!-- ================= GOOGLE SHEETS ================= -->
<script>
/* 👇 PEGA AQUÍ TU ENLACE DE GOOGLE SHEETS (CSV PUBLICADO) */
const SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQIJAiX1NwS4PrlDh_jARrzHgPeR2IH7JJuCa6fWjTZGVnHOB9fPqT_HDss_5zmtGD3205STqTVJYWB/pub?gid=0&single=true&output=csv";

fetch(SHEET_URL)
  .then(r => r.text())
  .then(csv => {
      const lines = csv.trim().split("\n");
      const rows = lines.slice(1).map(l => l.split(","));

      if (rows.length === 0) return;

      // TÍTULO (columna A)
      document.getElementById("titulo").textContent = rows[0][0];

      // LISTA DE MENSAJES (columna B)
      const ul = document.getElementById("lista");
      ul.innerHTML = "";

      rows.forEach(r => {
          if (r[1]) {
              const li = document.createElement("li");
              li.textContent = r[1];
              ul.appendChild(li);
          }
      });
  })
  .catch(() => {
      document.getElementById("titulo").textContent =
          "No se pudo cargar la información de seguridad";
  });

// 🔄 refresco automático cada 5 minutos (opcional)
setInterval(() => location.reload(), 300000);
</script>

</body>
</html>
