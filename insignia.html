<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa Oficial ENAIRE - LEMU</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #0b111a;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }
    .reloj-flotante {
      position: absolute;
      bottom: 12px;
      left: 12px;
      z-index: 1000;
      background: rgba(15, 23, 42, 0.9);
      color: #fbbf24;
      padding: 8px 14px;
      border-radius: 6px;
      border: 1px solid #334155;
      font-size: 14px;
      font-weight: bold;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div class="reloj-flotante" id="reloj-utc">Cargando UTC...</div>

  <iframe 
    src="https://drones.enaire.es/?lat=38.4392&lon=-0.4742&zoom=11" 
    allow="geolocation">
  </iframe>

  <script>
    function actualizarReloj() {
      const ahora = new Date();
      const utc = ahora.toISOString().substring(11, 19) + ' UTC (Z)';
      document.getElementById('reloj-utc').textContent = 'LEMU | ' + utc;
    }
    setInterval(actualizarReloj, 1000);
    actualizarReloj();
  </script>
</body>
</html>
